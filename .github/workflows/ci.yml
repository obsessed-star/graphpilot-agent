name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m graphpilot.cli demo
      - run: python -m build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent
      - uses: actions/checkout@v4
        with:
          repository: obsessed-star/usbphone-control
          path: phone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r agent/requirements-dev.lock
      - run: python -m pip install -r phone/requirements-dev.lock
      - run: python -m pip install --no-deps -e agent -e phone
      - run: python -m pytest -q agent/tests phone/tests
