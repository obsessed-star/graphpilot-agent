[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphpilot-agent"
version = "0.1.0"
description = "A provider-neutral LangGraph agent with inspectable tool execution and Android control."
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "litellm>=1.80,<2", "python-dotenv>=1,<2", "jsonschema>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
graphpilot = "graphpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
